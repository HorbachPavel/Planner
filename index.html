<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FocusFlow</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23437060'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EF%3C/text%3E%3C/svg%3E">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #f9f8f6; --surface: #ffffff; --text: #333333;
      --accent: #437060; --accent-hover: #365a4d;
      --border: #e0e0e0; --overdue: #b74b4b; --now-bg: #fdf5e6;
      --now-text: #8c5a2b; --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; max-width: 900px; margin: 0 auto; }
    
    .auth-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; color: #666; background: #eee; padding: 10px 15px; border-radius: var(--radius); }
    .btn-auth { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    
    .tabs { display: flex; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 20px; }
    .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; font-weight: 600; border: none; background: transparent; font-size: 14px; }
    .tab.active { background: var(--accent); color: white; border-radius: var(--radius); }
    
    .input-area { background: var(--surface); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
    .input-area input[type="text"] { flex: 1; border: none; outline: none; font-size: 16px; background: transparent; }
    .input-area select { border: none; outline: none; background: transparent; font-size: 14px; cursor: pointer; }
    .btn-enter { background: #eadecd; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; color: #5a4022; }
    
    .now-bar { background: var(--now-bg); border: 1px solid #f0e6d2; padding: 12px 20px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .now-label { font-size: 12px; font-weight: bold; color: var(--now-text); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; }
    .now-title { font-weight: 600; font-size: 15px; margin-left: 10px; color: var(--text); }
    .btn-done { background: #e3efe9; border: 1px solid #c2dcd0; color: var(--accent); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }

    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .list-header h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .task-count { color: #888; font-weight: normal; font-size: 14px; }
    .view-toggles { display: flex; background: #e9ecef; border-radius: 20px; overflow: hidden; }
    .view-toggle { padding: 6px 16px; border: none; background: transparent; cursor: pointer; font-size: 13px; font-weight: 600; }
    .view-toggle.active { background: var(--accent); color: white; border-radius: 20px; }

    .group-title { font-size: 11px; font-weight: bold; text-transform: uppercase; margin: 20px 0 10px; padding-left: 10px; border-left: 2px solid #ccc; letter-spacing: 0.5px; }
    .group-title.overdue { color: var(--overdue); border-left-color: var(--overdue); }
    .group-title.today { color: #d98f2b; border-left-color: #d98f2b; }
    .group-title.this-week { color: var(--accent); border-left-color: var(--accent); }
    .group-title.pinned { color: var(--accent); border-left-color: var(--accent); }
    
    .task, .person { background: var(--surface); padding: 12px 15px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 8px; transition: opacity 0.2s; }
    .task { display: flex; align-items: center; gap: 15px; }
    .task.dragging, .person.dragging { opacity: 0.4; border: 2px dashed var(--accent); }
    .drag-handle { cursor: grab; color: #bbb; user-select: none; font-weight: bold; font-size: 16px; min-width: 20px; text-align: center; }
    .task-flag { font-weight: 900; font-size: 18px; margin-right: -5px; user-select: none; cursor: pointer; }
    .task-title { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; }
    .task-checkbox { min-width: 18px; height: 18px; cursor: pointer; border-radius: 50%; border: 1px solid #bbb; appearance: none; display: flex; align-items: center; justify-content: center; }
    .task-checkbox:checked { background: var(--accent); border-color: var(--accent); }
    
    .person-header { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
    .person-name { flex: 1; border: none; outline: none; font-size: 16px; font-weight: 600; background: transparent; }
    .btn-delete { background: none; border: none; color: #bbb; cursor: pointer; font-size: 14px; }
    .notes-container { padding-left: 35px; margin-top: 8px; }
    .note-line { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .note-bullet { color: #888; font-size: 18px; line-height: 20px; }
    .note-input { flex: 1; border: none; outline: none; font-size: 14px; color: #555; background: transparent; resize: none; padding-top: 2px; }

    #toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 20px; transition: 0.3s; z-index: 1000; }
    #toast.show { bottom: 20px; }
    .hidden { display: none !important; }
    
    /* Блок для отлова критических ошибок */
    #errorBanner { display: none; background: #b74b4b; color: white; padding: 12px; text-align: center; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div id="errorBanner"></div>

  <div class="auth-bar">
    <div style="display:flex; gap: 10px; align-items:center;">
      <strong>FocusFlow</strong>
      <span id="syncStatus">Офлайн / Локальное хранилище</span>
    </div>
    <button id="authBtn" class="btn-auth" onclick="handleAuth()">Включить синхронизацию</button>
  </div>

  <div class="tabs">
    <button id="tab-work" class="tab active" onclick="switchTab('work')">Work</button>
    <button id="tab-personal" class="tab" onclick="switchTab('personal')">Personal</button>
    <button id="tab-todiscuss" class="tab" onclick="switchTab('todiscuss')">To discuss</button>
  </div>

  <div id="tasks-container">
    <div class="input-area">
      <span style="color: #888;">+</span>
      <input type="text" id="taskInput" placeholder="Capture a task..." onkeydown="handleInputKey(event)">
      <select id="taskDate">
        <option value="overdue">Overdue</option>
        <option value="today" selected>Today</option>
        <option value="tomorrow">Tomorrow</option>
        <option value="this_week">This week</option>
        <option value="next_week">Next week</option>
        <option value="later">Later</option>
      </select>
      <button class="btn-enter" onclick="addTask()">Enter</button>
    </div>

    <div class="now-bar" id="nowBar">
      <div class="now-label">✨ NOW <span class="now-title" id="nowTitle"></span></div>
      <button class="btn-done" onclick="completeNowTask()">✓ Done</button>
    </div>

    <div class="list-header">
      <h3>Tasks <span class="task-count" id="taskCount">0</span></h3>
      <div class="view-toggles">
        <button class="view-toggle active" id="btnActive" onclick="switchView('active')">Active</button>
        <button class="view-toggle" id="btnDone" onclick="switchView('done')">Done</button>
      </div>
    </div>

    <div id="taskList" ondragover="onDragOverList(event)" ondrop="onDropTask(event)"></div>
  </div>

  <div id="todiscuss-container" class="hidden">
    <div class="input-area">
      <span style="color: #888;">+</span>
      <input type="text" id="personInput" placeholder="Add a person..." onkeydown="if(event.key === 'Enter') addPerson()">
      <button class="btn-enter" onclick="addPerson()">Enter</button>
    </div>
    
    <div class="list-header">
      <h3>People <span class="task-count" id="peopleCount">0</span></h3>
      <button class="view-toggle active" onclick="toggleNotes()">Toggle Notes</button>
    </div>

    <div id="peopleList" ondragover="onDragOverList(event)" ondrop="onDropPerson(event)"></div>
  </div>

  <div id="toast"></div>

  <script>
    // 1. ОТЛОВ КРИТИЧЕСКИХ ОШИБОК
    window.onerror = function(msg, url, line) {
      const banner = document.getElementById('errorBanner');
      if (banner) {
        banner.style.display = 'block';
        banner.innerText = `System Error: ${msg} (Line: ${line})`;
      }
    };

    const CLIENT_ID = '49484425550-6lbhol7vhovnrhosuh3qlahfv9eavgee.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    let tokenClient, accessToken = null, driveFileId = null;

    let currentTab = 'work'; 
    let currentView = 'active'; 
    let notesExpanded = true;
    
    // 2. БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ ДАННЫХ
    let state = { tasks: [], people: [], updatedAt: Date.now() };
    try {
      const savedData = localStorage.getItem('focusflow_data');
      if (savedData) {
        const parsed = JSON.parse(savedData);
        if (parsed && typeof parsed === 'object') {
          state.tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
          state.people = Array.isArray(parsed.people) ? parsed.people : [];
          state.updatedAt = parsed.updatedAt || Date.now();
        }
      }
    } catch (e) {
      console.error("Corrupted local data", e);
    }

    const GROUPS = ['overdue', 'today', 'tomorrow', 'this_week', 'next_week', 'later'];
    const GROUP_LABELS = { overdue: 'Overdue', today: 'Today', tomorrow: 'Tomorrow', this_week: 'This week', next_week: 'Next week', later: 'Later' };
    const PALETTE = ['#e06c75', '#98c379', '#e5c07b', '#61afef', '#c678dd', '#56b6c2'];

    window.onload = () => {
      checkDateShift();
      render();
      
      // Защищенный таймер ожидания Google API
      let attempts = 0;
      const checkGSI = setInterval(() => {
        attempts++;
        if (typeof google !== 'undefined' && google.accounts) {
          clearInterval(checkGSI);
          initGoogleAuth();
        } else if (attempts > 50) { // Стоп после 5 секунд
          clearInterval(checkGSI);
          document.getElementById('syncStatus').innerText = 'API недоступно (Offline/AdBlock)';
        }
      }, 100);
    };

    function initGoogleAuth() {
      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: async (response) => {
            if (response.error) return;
            accessToken = response.access_token;
            document.getElementById('authBtn').innerText = 'Синхронизировано';
            document.getElementById('authBtn').disabled = true;
            document.getElementById('syncStatus').innerText = 'Проверка облака...';
            await initDriveSync();
          },
        });
      } catch (e) { console.error('GSI Init Error', e); }
    }

    function handleAuth() { 
      if (tokenClient) tokenClient.requestAccessToken(); 
      else showError('Google API еще не загрузилось');
    }

    async function initDriveSync() {
      try {
        const res = await fetch("https://www.googleapis.com/drive/v3/files?q=name='focusflow_data.json' and trashed=false", {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        
        if (data.files && data.files.length > 0) {
          driveFileId = data.files[0].id;
          const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, { headers: { Authorization: `Bearer ${accessToken}` } });
          const remoteState = await fileRes.json();
          
          const localTime = state.updatedAt || 0;
          const remoteTime = remoteState.updatedAt || 0;
          
          if (localTime >= remoteTime && state.tasks.length >= (remoteState.tasks?.length || 0)) {
            await syncToDrive(false);
          } else {
            state.tasks = Array.isArray(remoteState.tasks) ? remoteState.tasks : [];
            state.people = Array.isArray(remoteState.people) ? remoteState.people : [];
            state.updatedAt = remoteState.updatedAt || Date.now();
            saveLocally(false);
          }
          render();
        } else {
          await syncToDrive(true);
        }
        document.getElementById('syncStatus').innerText = 'Синхронизация активна';
        createDailyBackup();
      } catch (err) {
        document.getElementById('syncStatus').innerText = 'Ошибка сети';
      }
    }

    async function syncToDrive(isNew = false) {
      if (!accessToken) return;
      document.getElementById('syncStatus').innerText = 'Сохранение...';
      state.updatedAt = Date.now();
      
      try {
        const fileContent = JSON.stringify(state);
        if (isNew || !driveFileId) {
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify({ name: 'focusflow_data.json', mimeType: 'application/json' })], { type: 'application/json' }));
          form.append('file', new Blob([fileContent], { type: 'application/json' }));
          const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body: form });
          const file = await res.json();
          driveFileId = file.id;
        } else {
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
            method: 'PATCH', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: fileContent
          });
        }
        document.getElementById('syncStatus').innerText = 'Сохранено в GDrive';
      } catch(e) { document.getElementById('syncStatus').innerText = 'Сбой сохранения'; }
    }

    async function createDailyBackup() {
      if (!accessToken) return;
      const today = new Date().toISOString().split('T')[0];
      if (localStorage.getItem('focusflow_last_backup') === today) return;
      try {
        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify({ name: `focusflow_backup_${today}.json`, mimeType: 'application/json' })], { type: 'application/json' }));
        form.append('file', new Blob([JSON.stringify(state)], { type: 'application/json' }));
        await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body: form });
        localStorage.setItem('focusflow_last_backup', today);
      } catch(e) {}
    }

    function saveLocally(sync = true) {
      state.updatedAt = Date.now();
      localStorage.setItem('focusflow_data', JSON.stringify(state));
      if (sync) syncToDrive();
    }

    function checkDateShift() {
      try {
        const today = new Date().toDateString();
        const lastDate = localStorage.getItem('focusflow_last_date');
        if (!lastDate) { localStorage.setItem('focusflow_last_date', today); return; }
        if (lastDate !== today) {
          const daysDiff = Math.floor((new Date(today) - new Date(lastDate)) / 86400000);
          let shifted = false;
          state.tasks.forEach(t => {
            if (t && t.status === 'active') {
              if (t.date === 'today') { t.date = 'overdue'; shifted = true; }
              else if (t.date === 'tomorrow') { t.date = daysDiff === 1 ? 'today' : 'overdue'; shifted = true; }
            }
          });
          if (shifted) saveLocally();
          localStorage.setItem('focusflow_last_date', today);
        }
      } catch(e) { console.error(e); }
    }

    // 3. БЕЗОПАСНОЕ ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (Без использования event.target)
    function switchTab(tab) {
      currentTab = tab;
      
      // Сбрасываем все вкладки
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      
      // Активируем нужную вкладку по явному ID
      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) activeBtn.classList.add('active');
      
      document.getElementById('tasks-container').classList.toggle('hidden', tab === 'todiscuss');
      document.getElementById('todiscuss-container').classList.toggle('hidden', tab !== 'todiscuss');
      render();
    }
    
    function switchView(view) {
      currentView = view;
      document.getElementById('btnActive').classList.toggle('active', view === 'active');
      document.getElementById('btnDone').classList.toggle('active', view === 'done');
      render();
    }

    function showError(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function handleInputKey(e) {
      if (['1','2','3','4','5','6'].includes(e.key) && (e.ctrlKey || document.getElementById('taskInput').value === '')) {
         e.preventDefault();
         document.getElementById('taskDate').selectedIndex = parseInt(e.key) - 1;
         return;
      }
      if (e.key === 'Enter') addTask();
    }

    function addTask() {
      const title = document.getElementById('taskInput').value.trim();
      if (!title) return;
      if (state.tasks.some(t => t && t.tab === currentTab && t.status === 'active' && (t.title||'').toLowerCase() === title.toLowerCase())) {
        return showError('Задача с таким именем уже открыта.');
      }
      const selectedDate = document.getElementById('taskDate').value;
      state.tasks.unshift({ id: Date.now().toString(), tab: currentTab, title: title, date: selectedDate, status: 'active', flag: null, completedAt: null });
      document.getElementById('taskInput').value = '';
      document.getElementById('taskDate').value = 'today';
      saveLocally(); render();
    }

    function toggleTaskStatus(id) {
      const task = state.tasks.find(t => t && t.id === id);
      if (task) {
        if (task.status === 'active') { task.status = 'done'; task.completedAt = Date.now(); } 
        else {
          if (state.tasks.some(t => t && t.id !== id && t.tab === task.tab && t.status === 'active' && (t.title||'').toLowerCase() === (task.title||'').toLowerCase())) {
            return showError('Нельзя вернуть: задача уже активна.');
          }
          task.status = 'active'; task.completedAt = null;
        }
        saveLocally(); render();
      }
    }
